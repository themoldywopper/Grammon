{n:'I Too Had a Dream',lines:['Lesson two: I Too Had a Dream, a letter from Verghese Kurien to his grandson Siddharth, written in Anand in 2005. He says we are addicted to instant communication, but a telephone call gives only a fleeting joy, while a letter becomes a possession that can be treasured and re-read, with abiding pleasure.','Kurien started his working life soon after independence, dreaming of an India free from hunger and poverty. About fifty years ago he agreed to work for a small cooperative of dairy farmers. He could have become a chief executive, an Army general or a successful NRI, but he chose to serve in Anand, Gujarat, and his wife ardently supported him.','His message: integrity, being honest to yourself, is the most important value. Life is a privilege, and failure is not putting in your best effort for the common good. He was awarded the Padma Vibhushan in 1999, and he told Siddharth to earn his own reward. Who says one man cannot make a change?']},

{n:'Fact and Opinion',lines:["Lesson four: fact and opinion. A fact is something that can be proven true or false. It is not based on people's beliefs. An opinion is a belief, feeling or judgement. It can vary from person to person and it cannot be proven.",'Examples from Encyclopedia Brown: Encyclopedia\'s father was the Chief of Police, a fact. Two masked men held up the Diamond Mart, a fact. Everyone thought Chief Brown was the smartest police chief in the country, an opinion. Leroy\'s friends said he was like a library and computer in one, an opinion.','Examples from Kurien\'s letter: he was awarded the Padma Vibhushan in 1999, a fact. Speaking on the telephone only gives a fleeting joy, and integrity is the most important value, are opinions. Also learn the word case: situation, matter, container and writing format.']}];
const XT=[["Ragged has other meanings too. A ragged coastline has an uneven edge. Ragged breathing is not smooth or regular. And, informally, ragged means very tired after effort.","Contrast the two: her feet were aged and slow and trembling, while his feet were firm and strong. The boy felt proud, and his young heart was happy and well content."],['Key words: addicted means dependent on something, fleeting means short-lived, abiding pleasure is happiness that lasts, jottings are brief notes, foremost means leading, humility is modesty, and pursue means follow.','More words: envisioned means imagined, ardently shows strong feeling, poise is calm confidence, adhered means continued to support, integrity is honest and strong moral principles, correlation is a connection, and musings are long careful thoughts.'],['Key words: nickname is a pet name, hold-ups are robberies with threat or violence, a nursery grows young plants for sale, to testify is to make a statement in court, a hunch is a strong feeling, and loot is stolen goods.','More words: a stroke is a sudden serious illness, a will is a legal document about property after death, leafed through means quickly turned the pages, confessed means admitted, a code is a hidden message, and foreseen means predicted.'],['An anagram is a word or phrase made by rearranging the letters of another. Neat is an anagram of a net. In the crossword, aces makes case, tool makes loot, heart makes earth, and sword makes words.','The word case has many meanings. Not the case means not the situation. A court case is a legal matter. A pencil case is a container. Title case is a writing format.']];
